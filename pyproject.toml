[project]
name = "janus"
version = "4.0.0"
description = "Janus 4.0: a small durable flow engine for Codex"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "examples/angular-upgrade"]
testpaths = ["tests", "examples/angular-upgrade/tests"]
